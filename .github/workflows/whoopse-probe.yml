name: whoopse-probe
on:
  push:
    branches: [ctf-whoopse-probe]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enumerate Whoopse API and docs
        shell: bash
        run: |
          set -u
          B='https://139.180.133.175'
          echo '=== OPENAPI ROOT ==='
          curl -sk "$B/openapi.json" -o /tmp/root.json
          cat /tmp/root.json
          echo
          echo '=== SUB SPECS ==='
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/root.json'))
          for x in d.get('x-specifications',[]): print(x.get('url',''))
          PY
          while read -r p; do
            [ -z "$p" ] && continue
            echo "--- $p ---"
            curl -sk "$B$p" -o /tmp/spec.json
            cat /tmp/spec.json
            echo
          done < <(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/root.json'))
          for x in d.get('x-specifications',[]): print(x.get('url',''))
          PY
          )
          echo '=== DEV PAGES / JS / AUTH FORMS ==='
          for p in developers developers/integrations static/js/app.js signup login status; do
            echo "--- /$p ---"
            curl -ski "$B/$p" | head -220
          done
